<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base terminal text style with subtle green glow */
        .text-glow {
            text-shadow: 0 0 4px rgba(34, 197, 94, 0.6), 0 0 8px rgba(34, 197, 94, 0.4);
        }

        /* Success message stronger glow */
 .text-glow-success {
       text-shadow: 0 0 5px rgba(74, 222, 128, 0.8), 0 0 15px rgba(74, 222, 128, 0.6);
        }
 /* Subtle scanline overlay to simulate old CRT monitors */
        .scanlines {
  background: linear-gradient(to bottom,
       rgba(255, 255, 255, 0),
      rgba(255, 255, 255, 0) 50%,
      rgba(0, 0, 0, 0.15) 50%,
      rgba(0, 0, 0, 0.15));
 background-size: 100% 4px;
 pointer-events: none;
     /* Allows clicking elements underneath */
        }
        /* Smooth fade-in animation for new text lines */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body
    class="bg-black h-screen flex flex-col items-center justify-center p-4 overflow-hidden text-green-500 font-mono relative">
    <div class="absolute inset-0 scanlines  z-50"></div>
    <div class="w-full max-w-3xl bg-gray-900 rounded-lg shadow-2xl border border-gray-700 overflow-hidden relative z-10 flex flex-col"
        style="height: 60vh; max-height: 500px;">
        <div class="flex items-center px-4 py-3 bg-gray-800 border-b border-gray-700">
     <div class="flex space-x-2">
   <div class="w-3.5 h-3.5 bg-red-500 rounded-full shadow-[0_0_5px_rgba(239,68,68,0.5)]"></div>
      <div class="w-3.5 h-3.5 bg-yellow-500 rounded-full shadow-[0_0_5px_rgba(234,179,8,0.5)]"></div>
  <div class="w-3.5 h-3.5 bg-green-500 rounded-full shadow-[0_0_5px_rgba(34,197,94,0.5)]"></div>
       </div>
 <div class="flex-1 text-center text-gray-400 text-sm font-semibold tracking-widest uppercase">
     Hacking Simulator
      </div>
        </div>
 <div id="terminal-content" class="flex-1 p-6 overflow-y-auto text-glow text-lg space-y-2">
        </div>
    </div>
    <button id="restart-btn"
        class="hidden mt-8 z-10 border border-green-500 text-green-500 px-6 py-2 rounded uppercase tracking-wider font-bold hover:bg-green-500 hover:text-black transition-colors duration-300 text-glow">
        Run Again
    </button>
    <script>
        /**
         * Hacking Simulator Logic
         * Uses Vanilla JavaScript, setTimeout, and DOM manipulation.
         */
        // 1. Define the exact sequential messages to be displayed
        const messages = [
            "Initializing Hacking",
            "Reading your Files",
            "Password files Detected",
            "Sending all passwords and personal files to server",
            "Cleaning up"
        ];

  // 2. DOM Element References
 const terminalContent = document.getElementById('terminal-content');
 const restartBtn = document.getElementById('restart-btn');
 // 3. Global interval reference for the blinking dots
     let dotsInterval;
        /**
         * Generates a random delay between a min and max value (in milliseconds)
         * Formula: Math.random() generates 0 to 0.99... Multiply by difference, add min.
         */
        function getRandomDelay(min = 1000, max = 7000) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        /**
         * Handles the continuous blinking of the "..." dots.
         * It finds all spans with class 'dots' and updates their text content.
         */
        function startDotsAnimation() {
            let dotCount = 0;
            dotsInterval = setInterval(() => {
    dotCount = (dotCount + 1) % 4; // Cycles: 0, 1, 2, 3
     let dotString = ".".repeat(dotCount);

   // Select all dot containers currently in the DOM
 const dotElements = document.querySelectorAll('.dots');
          dotElements.forEach(el => {
     el.textContent = dotString;
         });
  }, 500); // Updates every half second
        }
        /**
         * Stops the dots animation by clearing the interval.
         */
        function stopDotsAnimation() {
  clearInterval(dotsInterval);
        }
        /**
 * Appends the blinking cursor to the end of the terminal content.
         * If an old cursor exists, it removes it first so there is always only one.
         */
        function appendCursor() {
// Remove existing cursor if it exists
const existingCursor = document.getElementById('active-cursor');
 if (existingCursor) existingCursor.remove();
 // Create new cursor container
const cursorDiv = document.createElement('div');
     cursorDiv.id = 'active-cursor';
    cursorDiv.className = 'flex items-center mt-1 text-green-400 fade-in';
    // Add prompt symbol and blinking block
            cursorDiv.innerHTML = `
     <span class="mr-2 font-bold">></span>
<span class="w-3 h-5 bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)] block"></span>
            `;
 terminalContent.appendChild(cursorDiv);
            // Auto-scroll to the bottom of the terminal window
 terminalContent.scrollTop = terminalContent.scrollHeight;
        }

        function simulateHacking(index) {
   // Check if we have displayed all messages
     if (index >= messages.length) {
 // Wait one last random delay before showing "Process Completed"
 setTimeout(() => {
  // Stop dots from animating and set them all to "..." solidly
      stopDotsAnimation();
      document.querySelectorAll('.dots').forEach(el => el.textContent = "...");

   // Remove cursor, append success message, append cursor again
  const existingCursor = document.getElementById('active-cursor');
    if (existingCursor) existingCursor.remove();
      const successDiv = document.createElement('div');
          successDiv.className = 'mt-4 text-xl font-bold text-green-400 text-glow-success fade-in';
          successDiv.textContent = "Process Completed.";
 terminalContent.appendChild(successDiv);

     appendCursor();
 // Show the restart button
          restartBtn.classList.remove('hidden');
     }, getRandomDelay());
         return; // Exit recursion
            }
         // Execute the delay, then show the message
     setTimeout(() => {
     // Create container for the current message line
       const lineDiv = document.createElement('div');
 lineDiv.className = 'flex items-center text-green-500 fade-in';
            // Add the text and the dynamic dots span
lineDiv.innerHTML = `
         <span class="mr-1">></span> 
     <span>${messages[index]}</span>
     <span class="dots w-8 inline-block"></span>
    `;
     // Append message and move cursor below it
     terminalContent.appendChild(lineDiv);
     appendCursor();
     // Recursively call the next message
     simulateHacking(index + 1);
     }, getRandomDelay());
     }
        /**
         * Starts or Restarts the simulation.
         * Clears everything, resets variables, and triggers the recursive loop.
         */
        function startSimulation() {
            // Hide the button
            restartBtn.classList.add('hidden');
            // Clear previous terminal content
            terminalContent.innerHTML = '';

 // Stop any leftover animations
 stopDotsAnimation();
 // Add initial cursor
 appendCursor();
            // Start dynamic dots logic
            startDotsAnimation();
            // Begin sequential rendering starting at message index 0
            simulateHacking(0);
        }
        // Attach event listener to the "Run Again" button
        restartBtn.addEventListener('click', startSimulation);
        // Start the simulation immediately on page load
        window.onload = startSimulation;
    </script>
</body>
</html>
